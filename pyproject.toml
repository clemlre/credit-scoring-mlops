[project]
name = "credit-scoring-mlops"
version = "0.1.0"
description = "Mise en production du modèle de scoring de crédit Prêt à Dépenser : API, Docker, CI/CD et monitoring (OpenClassrooms P8 - MLOps 2/2)"
readme = "README.md"
requires-python = ">=3.11,<3.12"

# Dépendances de l'API : ce sont les seules installées dans l'image Docker.
# lightgbm reste à la version qui a produit l'artefact.
dependencies = [
    "lightgbm==4.6.0",
    "numpy<2.3",
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "psycopg[binary,pool]==3.2.12",
]

# Groupes hors image Docker : `uv sync --group <nom>`.
[dependency-groups]
# Entraînement de la Partie 1 et export du modèle.
training = [
    "scikit-learn==1.8.0",
    "pandas==2.3.3",
    "pyarrow==23.0.1",
    "mlflow==3.12.0",
    "optuna==4.8.0",
    "shap==0.51.0",
    "xgboost==3.2.0",
    "numba>=0.60",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "missingno==0.5.2",
    "jupyter==1.1.1",
    "ipykernel==7.2.0",
]
# pandas/pyarrow : tests de fidélité sur les données réelles de la Partie 1.
dev = [
    "httpx==0.28.1",
    "pandas==2.3.3",
    "pyarrow==23.0.1",
    "pytest",
    "pytest-cov",
    "ruff",
]
# Analyse du data drift.
monitoring = [
    "evidently==0.7.21",
]
# Évaluation d'ONNX Runtime (scripts/evaluer_onnx.py).
perf = [
    "onnx==1.22.0",
    "onnxmltools==1.16.0",
    "onnxruntime==1.29.0",
]

[tool.uv]
package = false
# Résolution Windows (poste de dev) et Linux (image, CI). La Partie 1 était
# épinglée win32 seulement.
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["api"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
line-length = 100
