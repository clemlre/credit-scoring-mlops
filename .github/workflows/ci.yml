name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  qualite:
    name: Lint et tests
    runs-on: ubuntu-latest

    # PostgreSQL éphémère pour les tests d'intégration du stockage. Le mot de passe
    # n'est pas un secret : la base n'existe que le temps du job.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scoring
          POSTGRES_PASSWORD: postgres_ci
          POSTGRES_DB: monitoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Installer Python 3.11
        run: uv python install 3.11

      - name: Installer les dépendances
        run: uv sync --frozen

      - name: Vérifier le style
        run: uv run ruff check api monitoring tests src scripts

      - name: Lancer les tests avec mesure de couverture
        env:
          DATABASE_URL: postgresql://scoring:postgres_ci@localhost:5432/monitoring
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-de-couverture
          path: coverage.xml
          if-no-files-found: warn

  image:
    name: Image Docker
    needs: qualite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: credit-scoring-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Démarrer le conteneur
        run: docker run -d --name api-ci -p 8000:8000 credit-scoring-api:ci

      - name: Tester le service qui tourne
        run: python scripts/smoke_test.py http://127.0.0.1:8000

      - name: Récupérer les journaux du conteneur
        if: always()
        run: docker logs api-ci

      - name: Arrêter le conteneur
        if: always()
        run: docker rm -f api-ci

      - name: S'authentifier auprès du registre
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer les étiquettes de l'image
        if: github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Publier l'image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploiement:
    name: Déploiement
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Préparer la configuration du Space
        # En-tête YAML attendu par Hugging Face en tête du README. Les captures
        # d'écran sont retirées : le Space refuse les binaires hors Xet.
        run: |
          {
            echo "---"
            echo "title: API de scoring de credit"
            echo "emoji: 💳"
            echo "colorFrom: blue"
            echo "colorTo: indigo"
            echo "sdk: docker"
            echo "app_port: 8000"
            echo "pinned: false"
            echo "---"
            echo
            cat README.md
          } > README.space.md
          mv README.space.md README.md
          rm -rf docs/screenshots

      - name: Déployer sur Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        # Instantané sans historique : HF rejette tout blob binaire présent dans
        # l'historique poussé.
        run: |
          : "${HF_TOKEN:?secret HF_TOKEN absent}" "${HF_SPACE:?variable HF_SPACE absente}"
          git config user.email "ci@users.noreply.github.com"
          git config user.name "CI"
          git checkout --orphan deploiement
          git add -A
          git commit -m "Deploiement automatique depuis ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git remote add space "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}"
          git push --force space deploiement:main

      - name: Vérifier le service déployé
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          for i in $(seq 1 60); do
            reponse=$(curl -s "https://huggingface.co/api/spaces/${HF_SPACE}")
            etat=$(printf '%s' "$reponse" | python -c 'import sys, json; print(json.load(sys.stdin).get("runtime", {}).get("stage", "INJOIGNABLE"))' 2>/dev/null || echo "INJOIGNABLE")
            echo "  [$i/60] état du Space : $etat"
            case "$etat" in
              RUNNING)
                echo "Space en service après $((i * 15)) s."
                break
                ;;
              BUILD_ERROR|RUNTIME_ERROR|CONFIG_ERROR)
                echo "::error::Le Space a échoué au stade $etat — voir les journaux du Space."
                exit 1
                ;;
            esac
            if [ "$i" -eq 60 ]; then
              echo "::error::Le Space n'est pas en service après 15 min (dernier état : $etat)."
              exit 1
            fi
            sleep 15
          done
          domaine="$(echo "$HF_SPACE" | tr '/' '-' | tr '[:upper:]' '[:lower:]').hf.space"
          echo "Test de fumée sur https://${domaine}"
          python scripts/smoke_test.py "https://${domaine}"
