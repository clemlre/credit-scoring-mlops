name: CI/CD

# Déclenché sur `main` (exigence du projet), mais aussi sur les pull requests qui
# la visent : détecter une régression avant la fusion vaut mieux que la détecter
# après. `workflow_dispatch` permet de relancer le pipeline à la main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Une nouvelle poussée sur la même branche annule le run précédent : inutile de
# payer une CI complète pour un commit déjà remplacé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --------------------------------------------------------------------------
  qualite:
    name: Lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Installer Python 3.11
        run: uv python install 3.11

      - name: Installer les dépendances
        # --frozen : le lock fait foi. Si pyproject.toml a changé sans que le lock
        # soit régénéré, le pipeline échoue ici plutôt que de tester autre chose
        # que ce qui sera déployé.
        run: uv sync --frozen

      - name: Vérifier le style
        run: uv run ruff check api tests src scripts

      - name: Lancer les tests avec mesure de couverture
        # Le plancher de couverture (95 %) est défini dans pyproject.toml et
        # appliqué par coverage lui-même : le job échoue si la couverture baisse.
        run: uv run pytest --cov=api --cov-report=term-missing --cov-report=xml

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-de-couverture
          path: coverage.xml
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  image:
    name: Image Docker
    needs: qualite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Chargée dans le démon local : on la teste pour de vrai avant d'envisager
          # de la publier. Une image qui se construit n'est pas une image qui marche.
          load: true
          tags: credit-scoring-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Démarrer le conteneur
        run: |
          docker run -d --name api-ci -p 8000:8000 credit-scoring-api:ci
          echo "Conteneur démarré."

      - name: Tester le service qui tourne
        # Teste le conteneur réel : disponibilité, chargement du modèle, prédiction
        # cohérente avec le seuil, et refus d'une entrée invalide.
        run: python scripts/smoke_test.py http://127.0.0.1:8000

      - name: Récupérer les journaux du conteneur
        if: always()
        run: docker logs api-ci

      - name: Arrêter le conteneur
        if: always()
        run: docker rm -f api-ci

      # --- Publication : uniquement depuis main, jamais depuis une pull request ---
      - name: S'authentifier auprès du registre
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Jeton fourni automatiquement par GitHub, à la durée de vie du job.
          # Aucun identifiant n'est écrit dans le dépôt.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer les étiquettes de l'image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Publier l'image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # --------------------------------------------------------------------------
  deploiement:
    name: Déploiement
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la présence des identifiants de déploiement
        id: verif
        # Un secret ne peut pas être testé dans un `if:` de job : on l'évalue ici,
        # et les étapes suivantes s'appuient sur le résultat. Le secret n'est jamais
        # affiché, seulement sa présence.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -n "$HF_TOKEN" ] && [ -n "$HF_SPACE" ]; then
            echo "configure=true" >> "$GITHUB_OUTPUT"
            echo "Identifiants présents : déploiement vers $HF_SPACE."
          else
            echo "configure=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Déploiement ignoré — définissez le secret HF_TOKEN et la variable HF_SPACE pour l'activer."
          fi

      - name: Déployer sur Hugging Face Spaces
        if: steps.verif.outputs.configure == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          # Le jeton passe par l'URL distante, jamais par un fichier du dépôt.
          git remote add space "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}"
          git push --force space HEAD:main

      - name: Vérifier le service déployé
        if: steps.verif.outputs.configure == 'true'
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          # Un déploiement n'est terminé que quand le service répond.
          espace=$(echo "$HF_SPACE" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          python scripts/smoke_test.py "https://${espace}.hf.space"
